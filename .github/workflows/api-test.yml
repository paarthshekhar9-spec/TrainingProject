name: Run Ecommerce API Tests

on:
  push:
    branches:
      - master

jobs:
  newman-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: newman run EcommerceAPIProject.json -e TestEnvironment.postman_environment.json
